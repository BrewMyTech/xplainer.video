<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer loads only what electron-vite bundled next to this file. The
      websocket and http allowances cover the Vite dev server's hot-reload
      channel, which is reachable on loopback in `electron-vite dev` only.

      `xplainer-media:` is on img-src and media-src because the player's <video>
      and the stills load over that scheme, and the main process is what puts an
      Authorization on the request behind it. Without it the frame is blocked by
      this policy and playback fails with nothing in the window to say why. The
      daemon's own origin is deliberately NOT here: a page that could reach it
      would need the bearer token, and R-SEC-7 forbids the CORS that would take.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: xplainer-media:; media-src 'self' xplainer-media:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Xplainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
