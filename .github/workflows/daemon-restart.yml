# The `[runner]` half of T13: the drain route and the three restart adapters,
# against real service managers on machines this project's authors do not have.
#
# WHAT IT CLOSES. T13's criterion 7 — "`systemctl --user restart xplainer`
# during a job is proved on `ubuntu-latest` (and local in the container), the
# macOS adapter local, and the Windows adapter on `windows-latest`". Spike P2-S5
# measured the three supervisors two batches ago through a **fixture** route,
# because `POST /api/daemon/drain` did not exist yet; ADR 0024's note of
# 2026-09-08 says what closes that gap — "T13 proves these same three adapters
# against the real route" — and `install/testing/restart-proof.ts` is that proof.
# It registers the shipped artefact under a throwaway identity, runs the real
# `serve` with a real job in it, and asks three questions on every platform:
#
#   1. **the supervisor's own restart, during a job** — `systemctl --user
#      restart`, `launchctl kickstart -k`, and on Windows the stop-then-start
#      pair that is all Task Scheduler has. The drain has to have run inside it,
#      which is checked from the job record's own `daemon_shutdown` and not from
#      a log line.
#   2. **the real route, and the exit `0` it produces** — the drain over the
#      socket (a named pipe on Windows), the process going away, `runtime.json`
#      going with it, and then **nothing bringing it back**: `Restart=on-failure`,
#      `KeepAlive{SuccessfulExit:false}` and an ended task are three ways of
#      declining to restart a clean exit, and a proof that skipped this would be
#      describing a supervisor that never restarts anything.
#   3. **the shipped `xplainer daemon restart`** — the latches cleared first,
#      the route, and the adapter's own start command, end to end.
#
# WINDOWS IS THE PLATFORM NOTHING HERE CAN MEASURE. `SIGTERM` is
# `TerminateProcess` on Windows, so the route over the named pipe is not a
# convenience there — it is the only graceful stop that exists. The Task
# Scheduler arm of the proof is written from the documentation and this repo's
# adapter table and has **never been executed anywhere**; this job is where it
# becomes evidence, and until this workflow has reported, no record in this
# repository may say otherwise.
#
# THE HONEST STATUS, AND IT IS PART OF THE FILE. **Until this workflow has been
# dispatched and has reported, the runner half of T13 is unproven.**
# `workflow_dispatch` registers from the repository's **default branch**, so this
# file has to reach `main` before the API will accept a dispatch of it at all —
# GitHub's own rule, not a repository setting — and `--ref` then chooses whose
# code runs. It has never been dispatched.
#
#   gh workflow run daemon-restart.yml --ref "$(git branch --show-current)" -f windows=true
#   gh run watch "$(gh run list --workflow daemon-restart.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
#
# The per-OS booleans default to `linux=true`, `macos=false`, `windows=false`:
# a bare dispatch allocates the 1x Linux runner and nothing else, and the line
# above adds the Windows leg. Pass `-f macos=true` (10x) or `-f windows=true`
# (2x) for the leg a given question needs, and all three for the run that is
# offered as full platform coverage.
#
# WHAT RUNS LOCALLY INSTEAD, AND WHERE. The macOS half runs on a developer's own
# Mac against a real launchd, and the Linux half runs in
# `infra/e2e/Dockerfile.systemd` against a real per-user systemd — both with the
# commands in `restart-proof.ts`'s header. This workflow adds the two machines
# that cannot be reached from there: a hosted Linux VM, and Windows at all.
#
# WHY workflow_dispatch AND NOTHING ELSE. The rule `daemon-lifecycle.yml`,
# `e2e-runtime.yml`, `e2e-linux.yml`, `phase2-proofs.yml` and
# `daemon-windows.yml` all follow: these jobs install supervised daemons and wait
# out real 20-second drains, which is minutes of wall clock whose answer changes
# only when a supervisor or an adapter changes. `ci.yml` is the gate that runs on
# every push; this is a proof, and a proof is run when you want it.
#
# WHY NOTHING IS UPLOADED. Every job writes its whole transcript to stdout, so
# the job log **is** the artefact — and that keeps this workflow clear of the
# organisation-wide artifact-storage quota that has failed every upload step
# since 2026-09-07.

name: daemon restart

on:
  # ONE CHECKBOX PER OPERATING SYSTEM. Every leg of this proof still exists and
  # none of them is weakened; what the booleans decide is which of them a given
  # dispatch pays for. Linux is on by default because it is the 1x runner;
  # macOS bills at 10x and Windows at 2x, and re-running a green macOS leg to
  # look at a red Windows one is how 1,360 macOS minutes disappeared in three
  # days. Select all three for the run that is offered as full platform
  # coverage, and record the SHA and the selection beside its result.
  workflow_dispatch:
    inputs:
      linux:
        description: Run the Linux legs (ubuntu-latest).
        type: boolean
        default: true
      macos:
        description: Run the macOS legs (macos-latest, bills at 10x).
        type: boolean
        default: false
      windows:
        description: Run the Windows legs (windows-latest, bills at 2x).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A dispatch supersedes an in-flight dispatch of the same ref and the same
  # selection — a re-run of the same request — and leaves one that asked for
  # different operating systems running.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.linux }}-${{ inputs.macos }}-${{ inputs.windows }}
  cancel-in-progress: true

jobs:
  assertion:
    name: the drain route and the restart verb (${{ matrix.os }})
    # A dispatch that ticked nothing has asked for nothing.
    if: ${{ inputs.linux || inputs.macos || inputs.windows }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `unused` matches no entry in the vector above, so a selected
        # operating system is excluded by nothing and an unselected one is
        # removed before a runner is allocated — which is where the saving is.
        # A job that starts and then skips its steps has already been billed
        # for the runner it booted.
        exclude:
          - os: ${{ inputs.linux && 'unused' || 'ubuntu-latest' }}
          - os: ${{ inputs.macos && 'unused' || 'macos-latest' }}
          - os: ${{ inputs.windows && 'unused' || 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # `turbo`'s `test` task depends on the **dependencies'** builds, and the
      # step below runs vitest directly, so the build is a step of its own: an
      # unbuilt `@xplainer/protocol` is an import failure and it should read as
      # one.
      - name: Build every member
        run: pnpm turbo build

      # The files that are about the drain and about what protects the two files
      # a daemon writes, not the whole suite. Windows is the reason this matters
      # twice over: `daemon/ipc.ts` gives that platform a **named pipe** rather
      # than a unix socket, and every assertion here — the `202` over the socket,
      # the `404` over TCP, the real spawned `serve` drained over its own
      # endpoint — has only ever run against a socket; and a mode there protects
      # nothing, so `daemon/windows-acl.ts` applies ADR 0020 §R-SEC-5's explicit
      # ACL at creation and `token.test.ts` is where a real `icacls` says whether
      # it took. The last two are seconds each and run everywhere, so the POSIX
      # halves of both claims stay asserted beside the Windows ones.
      - name: The drain route, the client, the drained process and the restart verb
        run: >
          pnpm --filter @xplainer/cli exec vitest run
          src/server.test.ts
          src/daemon/control.test.ts
          src/daemon/token.test.ts
          src/daemon/windows-acl.test.ts
          src/commands/serve.test.ts
          src/install/lifecycle.test.ts

  systemd:
    name: systemctl --user restart during a job (ubuntu-latest)
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      # The same step `daemon-lifecycle.yml` and `phase2-proofs.yml` use, and for
      # the same reason: a hosted runner has no login session, so
      # `systemctl --user` reaches no manager until lingering starts one.
      - name: A per-user systemd manager, and what this runner had before
        shell: bash
        run: |
          set -uo pipefail
          echo "user: $(id)"
          echo "systemctl --user is-system-running before: $(systemctl --user is-system-running 2>&1 || true)"
          sudo loginctl enable-linger "$(id -un)" || true
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          state=""
          for _ in $(seq 1 20); do
            state=$(systemctl --user is-system-running 2>&1 || true)
            case "$state" in running|degraded|starting) break ;; esac
            sleep 1
          done
          echo "systemctl --user is-system-running after:  ${state:-<none>}"

      # `--here` is the runner form: the proof runs as **this** account rather
      # than re-entering as the container image's `xplainer` user through
      # `runuser`. Each of the three questions waits out a real 20-second drain,
      # so the job is minutes of wall clock by design.
      - name: The restart proof against a real systemd (T13, criterion 7)
        run: |
          node --import ./apps/cli/src/daemon/testing/ts-source-hook.ts \
            apps/cli/src/install/testing/restart-proof.ts --here

      - name: Leave no unit and no linger record behind
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          systemctl --user stop xplainer-t13-proof.service 2>&1 || true
          rm -f "$HOME/.config/systemd/user/xplainer-t13-proof.service"
          systemctl --user daemon-reload 2>&1 || true
          sudo loginctl disable-linger "$(id -un)" || true
          echo "left: $(ls "$HOME/.config/systemd/user" 2>&1 || echo '<no unit directory>')"

  launchd:
    name: launchctl kickstart -k during a job (macos-latest)
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      # A hosted macOS runner is a real login session with a real GUI domain,
      # which is what a LaunchAgent needs and what a container cannot have. This
      # half also runs on a developer's Mac; the runner is what makes it a
      # measurement on a machine nobody has configured.
      - name: The launchd domain this runner has
        run: |
          echo "uid: $(id -u)"
          launchctl print-disabled "gui/$(id -u)" | head -20 || true

      - name: The restart proof against a real launchd (T13, criterion 7)
        run: |
          node --import ./apps/cli/src/daemon/testing/ts-source-hook.ts \
            apps/cli/src/install/testing/restart-proof.ts

      # `launchctl` cannot remove a disable record, so the proof re-enables its
      # throwaway label in a `finally`. This step is the independent check that
      # the store was left as it was found.
      - name: The throwaway label was left enabled, and nothing is loaded
        if: always()
        run: |
          launchctl print-disabled "gui/$(id -u)" | grep -i 't13-proof' || echo 'no record for the throwaway label at all'
          launchctl bootout "gui/$(id -u)/video.xplainer.t13-proof" 2>&1 || echo 'nothing loaded'

  schtasks:
    name: the Task Scheduler adapter, executed at all (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      # The one platform where the drain route is not a convenience: Node maps
      # `SIGTERM` to `TerminateProcess` here, so a signal is never a drain and
      # the named pipe is the whole graceful path. Written from the
      # documentation and never executed until this job runs it.
      - name: The restart proof against a real Task Scheduler (T13, criterion 7)
        run: |
          node --import ./apps/cli/src/daemon/testing/ts-source-hook.ts `
            apps/cli/src/install/testing/restart-proof.ts

      - name: Unregister anything the proof left behind
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ScheduledTask -TaskPath '\xplainer\' -ErrorAction SilentlyContinue |
            ForEach-Object { Unregister-ScheduledTask -TaskName $_.TaskName -TaskPath $_.TaskPath -Confirm:$false }
          Write-Host 'throwaway task removed'
