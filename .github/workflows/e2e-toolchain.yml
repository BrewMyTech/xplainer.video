# The `[runner]` half of T33 and T20 criterion 3: `scripts/e2e/toolchain.mjs`
# on all three runner operating systems, and one Windows `setup` whose refusal
# is read back word for word.
#
# WHAT IT CLOSES. B6 proved T19, T20 and T33 on a developer's macOS machine and
# nowhere else, because nothing in `.github/workflows/` ran the toolchain gate
# at all. This is the machine-nobody-owns half: a clean checkout, the Node
# `.node-version` pins, no state, and — on `ubuntu-latest` — a real Docker
# engine, which is the only runner of the three that has one.
#
# THE SPEECH PROVIDER, ONE ANSWER PER RUNNER, WHICH IS THE POINT OF THE MATRIX.
# `speechPlan()` in the gate looks for a provider whose **lifetime this gate can
# own** — a server somebody else runs, or a container it can start on a free
# port and stop in a `finally` — and each runner lands on a different branch of
# it without this file having to say so:
#
#   * ubuntu-latest  — `XPLAINER_TTS_URL` is deliberately NOT set, so the gate
#     takes the **docker** route: `setup --speech docker` pulls the pinned
#     Kokoro-FastAPI image by digest with the runner's own `/usr/bin/docker`,
#     the gate then starts a container from that digest on a port the OS chose
#     and stops it in a `finally`. That is T19's docker provider exercised end
#     to end, and `/usr/bin/docker` resolves under the gate's scrubbed `PATH`
#     without the client-directory fallback macOS needs, so the D8 claim is
#     untouched. The flag is required rather than tidy: `onnx` sits above
#     `docker` in `setup`'s own precedence since 2026-09-10, and phase 5 of the
#     gate opens `marker.speech.path` as the docker receipt.
#   * macos-latest   — no such provider, and the narration leg is skipped with
#     its reason. GitHub's `services:` blocks — the way `e2e-linux.yml` supplies
#     Kokoro — **only run on Linux runners**, and `macos-latest` is an Apple
#     silicon host with no container engine. The gate says so in the transcript
#     and renders from T3's fixture audio instead; what macOS proves here is the
#     browser acquisition, the workspace, the degraded `/healthz`, the render
#     and the rollback rerun.
#   * windows-latest — no such provider either, for the same reason.
#
# NEITHER SKIP MEANS "NO SPEECH ON THAT PLATFORM" ANY MORE. Every platform has
# a working route: the in-process `onnx` synthesiser runs on all three, needs no
# container and no server, and `pnpm e2e:speech` is the proof that owns it. This
# gate does not take it, deliberately — ~204 MB from three upstream hosts, in a
# proof whose subject is the browser, the workspace and the rollback rerun — so
# the skip here is about what this gate exercises and never about what the
# product can do.
#
# WHY workflow_dispatch AND NOTHING ELSE. One run of this gate copies ~147 MB of
# payload out of the checkout, installs the ~234 MB render workspace from the
# registry, downloads a ~100 MB Chrome headless shell, renders a video, and then
# stages two more payloads six times over for the rollback rerun. On `push` that
# is three runners' worth of it on every commit. `ci.yml` is the gate that runs
# on every push; this is the proof, and a proof is run when you want the proof.
# It is the same argument that keeps `pnpm e2e:render`, `e2e-linux.yml` and
# `e2e-runtime.yml` out of `pnpm verify`.
#
# HOW TO DISPATCH IT. `workflow_dispatch` is registered from the **default
# branch**: until this file is on `main` the API answers a dispatch of it with
# 422 whatever `--ref` says, which is GitHub's own rule and not a repository
# setting. Once it is there, `--ref` chooses which branch's code the run
# executes.
#
#   gh workflow run e2e-toolchain.yml --ref "$(git branch --show-current)" -f windows=true
#   gh run watch "$(gh run list --workflow e2e-toolchain.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
#
# The per-OS booleans default to `linux=true`, `macos=false`, `windows=false`:
# a bare dispatch allocates the 1x Linux runner and nothing else, and the line
# above adds the Windows leg. Pass `-f macos=true` (10x) or `-f windows=true`
# (2x) for the leg a given question needs, and all three for the run that is
# offered as full platform coverage.

name: e2e-toolchain

on:
  # ONE CHECKBOX PER OPERATING SYSTEM. Every leg of this proof still exists and
  # none of them is weakened; what the booleans decide is which of them a given
  # dispatch pays for. Linux is on by default because it is the 1x runner;
  # macOS bills at 10x and Windows at 2x, and re-running a green macOS leg to
  # look at a red Windows one is how 1,360 macOS minutes disappeared in three
  # days. Select all three for the run that is offered as full platform
  # coverage, and record the SHA and the selection beside its result.
  workflow_dispatch:
    inputs:
      linux:
        description: Run the Linux legs (ubuntu-latest).
        type: boolean
        default: true
      macos:
        description: Run the macOS legs (macos-latest, bills at 10x).
        type: boolean
        default: false
      windows:
        description: Run the Windows legs (windows-latest, bills at 2x).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A dispatch supersedes an in-flight dispatch of the same ref and the same
  # selection — a re-run of the same request — and leaves one that asked for
  # different operating systems running.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.linux }}-${{ inputs.macos }}-${{ inputs.windows }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: toolchain gate (${{ matrix.os }})
    # A dispatch that ticked nothing has asked for nothing.
    if: ${{ inputs.linux || inputs.macos || inputs.windows }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Three answers, not one verdict: a Windows failure must not cancel the
      # macOS and Linux legs that are the evidence for the other two thirds.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `unused` matches no entry in the vector above, so a selected
        # operating system is excluded by nothing and an unselected one is
        # removed before a runner is allocated — which is where the saving is.
        # A job that starts and then skips its steps has already been billed
        # for the runner it booted.
        exclude:
          - os: ${{ inputs.linux && 'unused' || 'ubuntu-latest' }}
          - os: ${{ inputs.macos && 'unused' || 'macos-latest' }}
          - os: ${{ inputs.windows && 'unused' || 'windows-latest' }}
    # The gate itself is minutes of work. The budget is for everything around it
    # on a cold runner, each paid in full on every run: the install, a full
    # `turbo build` with no cache, the workspace's `npm ci`, Chrome's download,
    # the Kokoro image pull on ubuntu, the render, and then the rollback rerun,
    # which stages and switches payloads six more times.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      # `resolveTool()` in the gate takes `ffmpeg` and `ffprobe` off `PATH` (or
      # from `XPLAINER_FFMPEG`/`XPLAINER_FFPROBE`), and it needs them on every
      # runner: the still's width and height and the MP4's streams are read with
      # `ffprobe`, and the frame comparison pipes through `ffmpeg`. None of the
      # three images ships them, and each package manager is the one that image
      # already has — no third-party action is introduced for two binaries.
      - name: Install ffmpeg and ffprobe
        run: |
          set -euo pipefail
          if command -v ffprobe >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1; then
            echo "already present: $(command -v ffmpeg), $(command -v ffprobe)"
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows)
              choco install ffmpeg --yes --no-progress
              # A step's environment is captured before it runs, so a machine
              # `PATH` chocolatey edits mid-job reaches the next step only
              # through `$GITHUB_PATH`.
              printf '%s\n' 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
              ;;
            *) echo "unknown runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac

      # The Chrome headless shell `setup` downloads is a binary, not a bundle:
      # it links against the system's own X, GTK and audio libraries, and a
      # runner image carries only some of them. Four of the names moved in
      # Ubuntu's 64-bit time_t transition and the runner image is pinned by
      # GitHub rather than by us, so each of those is tried in its new spelling
      # and then in its old one instead of hard-coding a guess. macOS and
      # Windows need none of this: their Chrome builds link against the OS.
      - name: Install the Chrome headless shell libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          packages=(
            fonts-liberation
            libcairo2
            libdbus-1-3
            libdrm2
            libgbm1
            libnss3
            libpango-1.0-0
            libxcomposite1
            libxdamage1
            libxfixes3
            libxkbcommon0
            libxrandr2
          )
          for base in libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2; do
            if apt-cache show "${base}t64" >/dev/null 2>&1; then
              packages+=("${base}t64")
            else
              packages+=("$base")
            fi
          done
          sudo apt-get install -y -qq "${packages[@]}"

      # The docker route is what ubuntu is here for, and a client that answers
      # nothing turns the run into a skipped narration leg that still exits 0 —
      # a green run over the thing it was dispatched to prove. So the engine is
      # asked once, out loud, before anything long starts.
      - name: Show the Docker engine the gate will use (Linux only)
        if: runner.os == 'Linux'
        run: docker version --format '{{.Server.Version}}'

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # The gate runs `pnpm turbo build` itself, so this step is not what makes
      # the CLI current — it is what separates a build failure from a gate
      # failure in the job summary.
      - name: Build every member
        run: pnpm turbo build

      # `XPLAINER_TTS_URL` is unset on every leg, deliberately: it is what makes
      # ubuntu take the docker route rather than waiting on a server somebody
      # else started, and the other two have no route to name. See the matrix
      # note at the top of this file.
      #
      # `COLLIE_ARTIFACTS_DIR` is left unset too: the script's own default is
      # `<repo>/.session/artifacts`, the repository is the workspace, and the
      # upload below names that path.
      - name: Toolchain gate — setup, then still and render out of it (T33)
        run: pnpm e2e:toolchain

      # `always()`, because the transcript of a failed run is the thing worth
      # downloading — the gate names its failed assertion on the last line of
      # it. `if-no-files-found: error` then keeps a run that produced nothing at
      # all from reporting a green upload over an empty artifact. The name
      # carries the OS because upload-artifact refuses a name two jobs share.
      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-toolchain-${{ matrix.os }}
          path: .session/artifacts/e2e-toolchain.log
          if-no-files-found: error
          # A log, reproducible by re-running the workflow, times three runners
          # per dispatch. `desktop.yml` filled this repository's artifact quota
          # at the 90-day default on 2026-09-07 and every upload in every
          # workflow failed until it was cleared; five days outlives reading the
          # run that produced it and nothing more.
          retention-days: 5

  windows-setup-from-a-checkout:
    name: setup completes on windows from a checkout (T20 criterion 3)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    # A real acquisition: a ~98 MB browser, ~204 MB of speech artefacts from
    # three hosts, and an npm install of the render workspace.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      # WHAT THIS JOB USED TO BE, AND WHY IT COULD NOT STAY. It was
      # `windows-delivery-position`, and it asserted that `setup` **refused**:
      # nothing was published to the manifest host, so a plain `setup` failed in
      # its browser phase and `deliveryPosition()` was what it printed. That
      # premise died on 2026-09-11 when the manifest was published to
      # cdn.xplainer.video. `setup` now succeeds, so a job whose first check is
      # `if exit == 0 then FAIL` would fail on every dispatch while the product
      # was working correctly.
      #
      # It also cannot be rescued by forcing the failure from the CLI. The
      # refusal that carries `deliveryPosition()` — `ManifestUnreachable` in
      # setup/source.ts — is thrown only when the *published* URL fails AND no
      # committed copy sits beside the build, and `--manifest` deliberately does
      # NOT fall through when the source it names fails ("a reviewer who named a
      # candidate manifest and silently got the published one would be reviewing
      # the wrong document"). So there is no flag that reaches that branch, and
      # the message is asserted per-platform in setup/manifest.test.ts instead,
      # `win32-x64` included, by calling `deliveryPosition()` directly.
      #
      # WHAT IT ASSERTS INSTEAD, and it is strictly more than it used to. This
      # is the only place in the repository that runs `xplainer setup` from a
      # **checkout** on Windows — no staged payload 1, so `hostRuntimeDir()`
      # answers null and the workspace provider takes its resolve route. That is
      # exactly the configuration that could not work at all until 2026-09-10,
      # when `providers/workspace.ts` was spawning `npm.cmd` and libuv was
      # refusing it with EINVAL. The old job never caught it because it refused
      # at the browser and `setup`'s component order is browser, then speech,
      # then workspace: it stopped one phase short, for every release from B6
      # onward. Reaching the third component is the point of this job now.
      - name: setup acquires all three components
        shell: bash
        run: |
          set -uo pipefail
          state="${RUNNER_TEMP}/xplainer-t20-state"
          mkdir -p "$state"
          set +e
          node apps/cli/dist/bin.js setup --state-dir "$state" >setup.out 2>&1
          code=$?
          set -e
          echo "exit: $code"
          cat setup.out
          if [ "$code" -ne 0 ]; then
            echo "FAIL: setup exited $code; the manifest is published, so this is a real failure" >&2
            exit 1
          fi
          require_present() {
            if ! grep -qF "$1" setup.out; then
              echo "FAIL: setup did not report: $1" >&2
              exit 1
            fi
            echo "ok  present: $1"
          }
          # The manifest came over the network, not from a committed copy: a
          # published build has no committed copy, and reading one here would
          # mean this job was proving something no user experiences.
          require_present "manifest: https://cdn.xplainer.video/toolchain/v1/manifest.json"
          # All three components, in setup's own order.
          require_present "browser: acquired at"
          require_present "speech: took the onnx route"
          require_present "workspace:"
          require_present "recorded"
          require_present "platform win32-x64"
          # The retired reassurance must not reappear, on the platform whose
          # message carried the harder version of it.
          if grep -qF "expected state rather than an outage" setup.out; then
            echo "FAIL: the delivery-position reassurance is back, and it is false" >&2
            exit 1
          fi
          echo "ok  absent: expected state rather than an outage"

      # The recorded marker, which is what the install preflight reads. Proving
      # it parses here is cheaper than discovering on a user's machine that a
      # Windows path landed in it unescaped.
      - name: toolchain.json records all three components
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const { readFileSync } = require('node:fs');
            const path = process.env.RUNNER_TEMP + '/xplainer-t20-state/toolchain.json';
            const marker = JSON.parse(readFileSync(path, 'utf8'));
            for (const key of ['chrome', 'speech', 'workspace']) {
              if (!marker[key]) throw new Error('toolchain.json has no ' + key);
            }
            if (marker.speech.provider !== 'onnx') {
              throw new Error('speech provider is ' + marker.speech.provider + ', expected onnx');
            }
            console.log('ok  toolchain.json:', Object.keys(marker).join(', '));
          "

      - name: Upload the setup log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-toolchain-windows-setup-from-a-checkout
          path: setup.out
          if-no-files-found: error
          retention-days: 5
