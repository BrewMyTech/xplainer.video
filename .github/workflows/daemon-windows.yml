# The `[runner]` half of T11: `xplainer daemon install` against a real Windows
# Task Scheduler, and the two Windows facts nothing in this repository could
# measure on the machines it was written on.
#
# WHAT IT CLOSES. Three criteria, none of which can be established on any machine
# this project's authors have:
#
#   * **T11**, criterion 11 — the create → narrate gate from T3, run against the
#     **installed** daemon under the standard-user S4U principal, ending in a
#     terminal `done`. Registering and starting a task proves registration; it
#     does not prove that a job runs under a principal with no network
#     credentials and no access to encrypted files, and that is exactly what
#     `<LogonType>S4U</LogonType>` in `supervisors/schtasks.ts` asks for.
#   * **T11**, criterion 12 — whether `Register-ScheduledTask` is in fact the
#     only call that surfaces `SCHED_S_BATCH_LOGON_PROBLEM` (`0x0004131C`,
#     267036). The plan records that claim as **unverified**, and `install.ts`'s
#     failure message therefore names the missing right as a *candidate* rather
#     than a diagnosis. This job is where the guess ends, in one direction or the
#     other.
#   * **T8**, criterion 8 — that `fs.renameSync` **replaces an existing file** on
#     Windows rather than refusing. `install/launcher.ts` rewrites the stable
#     launcher by temp-then-rename and the update transaction depends on it. On
#     POSIX that is `rename(2)`'s documented behaviour; on Windows it is
#     `MoveFileEx`, and the answer is a property of the platform.
#   * **T14**, criterion 9 — that a worker's **whole tree** dies with it on
#     Windows. `process.kill(-pid)` is a POSIX process-group idiom Node does not
#     implement there, and `process-group.ts` documented the consequence for a
#     phase that did not target Windows: the pid alone is signalled and any
#     grandchildren are left, which is an orphaned `chrome.exe` after every
#     logoff. The worker is now put in a **Job Object with kill-on-close**, held
#     open by a `powershell.exe` keeper for the life of the worker, because Node
#     has no Job Object API and this project ships no native addon. Everything
#     about that is asserted from a decoded command on macOS and Linux; the
#     behaviour itself can only happen here.
#
# THE HONEST STATUS, AND IT IS PART OF THE FILE. **Until this workflow has been
# dispatched and has reported, all three are unproven, and no record in this
# repository may say otherwise.** `workflow_dispatch` registers from the
# repository's default branch, so this file has to reach `main` before the API
# will accept a dispatch of it at all — GitHub's own rule, not a repository
# setting — and `--ref` then chooses whose code runs. It has never been
# dispatched.
#
#   gh workflow run daemon-windows.yml --ref "$(git branch --show-current)" -f windows=true
#   gh run watch "$(gh run list --workflow daemon-windows.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
#
# `windows` is the per-OS boolean every proof workflow in this repository now
# carries, and here it is the only one there could be: all five jobs below are
# `windows-latest`. It therefore defaults to `true` rather than to the `false`
# the macOS and Windows checkboxes take elsewhere — a default of `false` would
# make the ordinary dispatch of this file a no-op, which is not a saving, it is
# a workflow that lies about having run. Clearing it is how a dispatch is
# cancelled after the fact without cancelling the run by hand.
#
# WHY workflow_dispatch AND NOTHING ELSE. The same rule `e2e-runtime.yml`,
# `e2e-linux.yml` and `phase2-proofs.yml` follow. This job creates a local
# account, registers and unregisters a real scheduled task, starts a supervised
# daemon and drives an MCP session through it — minutes of wall clock whose
# answer changes only when the installer or a renderer changes. `ci.yml` is the
# gate that runs on every push; this is a proof, and a proof is run when you want
# it.
#
# WHY A LOCAL STANDARD ACCOUNT. A hosted `windows-latest` runner executes as
# `runneradmin`, which is in the Administrators group, and registering an S4U
# task from an elevated session for an administrator is a strictly easier case
# than the one the product ships into. So both jobs create a **local standard
# user** and register for that account: that is the principal ADR 0020's
# degraded path is about, and the one whose missing "Log on as a batch job"
# right produces `SCHED_S_BATCH_LOGON_PROBLEM`. The account, its profile and
# every task registered for it are removed in an `always()` step.
#
# WHY ONE STEP IS A MEASUREMENT AND THE OTHER AN ASSERTION. Criterion 12 asks
# *whether* a claim is true, so the job that answers it prints what each call
# returned and exits `0` either way: a job that asserted the claim would fail on
# the answer "no", which is an answer worth having. The rename half is different
# — T8 already depends on it — so that one is asserted and fails the job.

name: daemon-windows

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Run the Windows jobs (windows-latest, bills at 2x).
        type: boolean
        default: true
      standard_user:
        description: The local standard account the task is registered for.
        required: false
        default: xplainer-t11
      second_user:
        description: The second local account T26's pipe probe runs as.
        required: false
        default: xplainer-t26

permissions:
  contents: read

concurrency:
  # A dispatch supersedes an in-flight dispatch of the same ref that asked for
  # the same thing — a re-run of the same request — and nothing else.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.windows }}
  cancel-in-progress: true

jobs:
  measure:
    name: rename, and which call warns (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # T8's criterion 8, asserted. `renameSync` is what `writeLauncher` uses to
      # publish a rewritten launcher, and a `rename` that refused an existing
      # file would leave the old launcher in place with a `.tmp` beside it and
      # every consumer pointed at the previous runtime.
      - name: fs.renameSync over an existing file (T8, criterion 8)
        shell: bash
        run: |
          cat > rename-probe.mjs <<'PROBE'
          import { mkdtempSync, readFileSync, renameSync, statSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import process from "node:process";

          const dir = mkdtempSync(join(tmpdir(), "xplainer-rename-"));
          const target = join(dir, "xplainer.cmd");
          const temporary = join(dir, ".xplainer.tmp");
          writeFileSync(target, "old\n");
          const before = statSync(target);
          writeFileSync(temporary, "new\n");

          renameSync(temporary, target);

          const after = statSync(target);
          const contents = readFileSync(target, "utf8");
          console.log(`platform         ${process.platform}`);
          console.log(`contents after   ${JSON.stringify(contents)}`);
          console.log(`ino before/after ${String(before.ino)} / ${String(after.ino)}`);
          if (contents !== "new\n") {
            console.log("FAIL: renameSync did not replace the existing file");
            process.exitCode = 1;
          } else {
            console.log("check: renameSync replaced an existing file");
          }
          PROBE
          node rename-probe.mjs

      # Criterion 12, measured rather than asserted — see the header. Every call
      # that could plausibly surface the warning is made in turn and what it
      # said is printed: the registration, the start, and the task info read
      # afterwards.
      - name: Which calls surface SCHED_S_BATCH_LOGON_PROBLEM (T11, criterion 12)
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:STANDARD_USER
          $task = "\xplainer\$user-probe"
          $secret = ConvertTo-SecureString -String ([System.Guid]::NewGuid().ToString() + 'aA1!') -AsPlainText -Force
          New-LocalUser -Name $user -Password $secret -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue | Out-Null
          Write-Host "principal: $env:COMPUTERNAME\$user (standard user, no group membership added)"

          # The document is the one `supervisors/schtasks.ts` renders, reduced to
          # the parts the warning depends on: an S4U principal and an <Exec>.
          $xml = @"
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.4" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
            <RegistrationInfo><Description>xplainer batch-logon probe</Description></RegistrationInfo>
            <Triggers><LogonTrigger><Enabled>true</Enabled><UserId>$env:COMPUTERNAME\$user</UserId></LogonTrigger></Triggers>
            <Principals><Principal id="Author"><UserId>$env:COMPUTERNAME\$user</UserId><LogonType>S4U</LogonType><RunLevel>LeastPrivilege</RunLevel></Principal></Principals>
            <Settings>
              <MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>
              <AllowStartOnDemand>true</AllowStartOnDemand>
              <Enabled>true</Enabled>
              <ExecutionTimeLimit>PT0S</ExecutionTimeLimit>
            </Settings>
            <Actions Context="Author"><Exec><Command>cmd.exe</Command><Arguments>/c exit 0</Arguments></Exec></Actions>
          </Task>
          "@

          Write-Host '--- Register-ScheduledTask ---'
          Register-ScheduledTask -Xml $xml -TaskName $task -Force -WarningVariable registerWarning -ErrorVariable registerError | Out-Null
          Write-Host "warnings: $($registerWarning -join ' | ')"
          Write-Host "errors:   $($registerError -join ' | ')"

          Write-Host '--- Start-ScheduledTask ---'
          Start-ScheduledTask -TaskName $task -WarningVariable startWarning -ErrorVariable startError
          Write-Host "warnings: $($startWarning -join ' | ')"
          Write-Host "errors:   $($startError -join ' | ')"

          Start-Sleep -Seconds 5
          Write-Host '--- Get-ScheduledTaskInfo ---'
          $info = Get-ScheduledTaskInfo -TaskName $task
          $info | Format-List | Out-String | Write-Host
          $result = $info.LastTaskResult
          Write-Host ("LastTaskResult: {0} (0x{1:X8})" -f $result, $result)
          if ($result -eq 267036) {
            Write-Host 'ANSWER: LastTaskResult carries SCHED_S_BATCH_LOGON_PROBLEM'
          } else {
            Write-Host 'ANSWER: LastTaskResult does not carry SCHED_S_BATCH_LOGON_PROBLEM on this run'
          }
          Write-Host 'This step is a measurement and exits 0 either way; the record is updated from it.'

      - name: Remove the throwaway account and every task it left
        if: always()
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ScheduledTask -TaskPath '\xplainer\' -ErrorAction SilentlyContinue |
            ForEach-Object { Unregister-ScheduledTask -TaskName $_.TaskName -TaskPath $_.TaskPath -Confirm:$false }
          Remove-LocalUser -Name $env:STANDARD_USER -ErrorAction SilentlyContinue
          Write-Host 'tasks and account removed'

  containment:
    name: a worker's whole tree dies with it (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # `turbo`'s `test` task depends on the **dependencies'** builds, and the
      # step below runs vitest directly, so the build is a step of its own.
      - name: Build every member
        run: pnpm turbo build

      # What the keeper needs from this machine, printed before anything depends
      # on it: `Add-Type` compiles C# with the in-box compiler, and a runner
      # without one would fail the assertions below for a reason that has
      # nothing to do with Job Objects.
      - name: The PowerShell this runner has, and whether it can compile a P/Invoke
        shell: pwsh
        run: |
          $PSVersionTable | Format-List | Out-String | Write-Host
          Add-Type -TypeDefinition 'public static class XplainerProbe { public static int Answer() { return 42; } }'
          Write-Host "Add-Type works: $([XplainerProbe]::Answer())"

      # The same suite that runs on every push on macOS and Linux, on the one
      # platform where two of its cases are about something else entirely: there
      # is no process group here, so "kills a leader that ignores SIGTERM, and
      # the grandchild it left behind" passes only if the Job Object caught the
      # grandchild. Before T14 this job would have failed, and that is the point
      # of running it.
      - name: The worker's process group, and the Job Object that replaces it
        run: pnpm --filter @xplainer/cli exec vitest run src/daemon/process-group.test.ts

      # A keeper that outlived its worker would be a process leak on every job,
      # so the last word is that none is left: each keeper waits for its own
      # worker and exits, and the job it was holding closes with it. The wait is
      # a loop rather than one look, because "still winding down" and "leaked"
      # are the same picture for the first second or two and only one of them is
      # worth failing a job over.
      - name: No keeper survived the suite
        if: always()
        shell: pwsh
        run: |
          $keepers = @()
          foreach ($attempt in 1..10) {
            $keepers = @(Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" |
              Where-Object { $_.CommandLine -like '*-EncodedCommand*' })
            if ($keepers.Count -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          $keepers | Select-Object ProcessId, CommandLine | Format-List | Out-String | Write-Host
          if ($keepers.Count -gt 0) { throw "a Job Object keeper outlived its worker by 20 s" }
          Write-Host 'no keeper left behind'

  install:
    name: install under the S4U principal, then create → narrate (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      # The install registers a payload assembled by `xplainer runtime build`,
      # never the checkout, and that command is `apps/cli/dist/bin.js`. An
      # unbuilt `dist/` is a refusal on its first page, so the build is a step of
      # its own and a build failure is legible as one.
      - name: Build every member
        run: pnpm turbo build

      - name: Create the standard account the task runs as
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $secret = ConvertTo-SecureString -String ([System.Guid]::NewGuid().ToString() + 'aA1!') -AsPlainText -Force
          New-LocalUser -Name $env:STANDARD_USER -Password $secret -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Write-Host "created $env:COMPUTERNAME\$env:STANDARD_USER (Users only)"

      # `xplainer runtime build` runs as the runner's own account, because
      # assembling a payload is not what is being measured; the state directory
      # it is staged into is one the standard user owns, so the daemon the task
      # starts can write there.
      - name: Assemble a payload and hand the state directory to the standard user
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'xplainer-t11'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          node apps/cli/dist/bin.js runtime build --out (Join-Path $root 'payload')
          New-Item -ItemType Directory -Path (Join-Path $root 'state') -Force | Out-Null
          icacls $root /grant "$($env:STANDARD_USER):(OI)(CI)F" /T | Out-Null
          "XPLAINER_T11_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "state directory: $root\state"

      # `daemon install` refuses without a setup marker, and `xplainer setup` is
      # T19. The fixture marker this story ships is materialised through the
      # same helper the unit tests use, so the marker an install reads here is
      # the one they read.
      - name: Write the synthetic toolchain marker
        shell: bash
        run: |
          node --import ./apps/cli/src/daemon/testing/ts-source-hook.ts -e "
            const { writeToolchainMarker } = await import('./apps/cli/src/install/testing/toolchain.ts');
            writeToolchainMarker(process.env.XPLAINER_T11_ROOT + '/state');
            console.log('marker written');
          "

      # A MEASUREMENT AND NOT AN ASSERTION, in the same spirit as criterion 12's
      # own step: it prints what it found and exits `0` either way.
      #
      # `daemon install` registers `\xplainer\<user>-daemon`, which is two things
      # at once — a task in a **subfolder** of the root task folder, and one
      # whose principal is **S4U** — and the first run of this job answered
      # `Register-ScheduledTask : Access is denied.` for the pair without saying
      # which half it refused (2026-09-09, run 34304159108). A standard user
      # registering in the root and a standard user creating a folder under it
      # are different rights, and so is registering a logon type that stores no
      # password, so the four combinations are registered as throwaway tasks and
      # each answer is printed. `icacls` on the root task folder is printed
      # beside them, because that folder's DACL is what decides the first half.
      - name: What a standard user may register, and where
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:XPLAINER_T11_ROOT
          $probe = Join-Path $root 'register-probe.ps1'
          $out = Join-Path $root 'register-probe.txt'
          # The child script, line by line rather than as a here-string: a here-string's terminator
          # has to sit in the first column, which nothing inside a YAML block scalar does. Nothing
          # here is expanded by this session either, which is the other half of what matters —
          # `Start-Process -Credential` hands the child *this* session's environment block, so the
          # identity the child must ask for is `WindowsIdentity::GetCurrent()` and never `%USERNAME%`.
          $lines = @(
            '$ErrorActionPreference = ''Continue''',
            '$me = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name',
            'Write-Output "running as $me"',
            'foreach ($name in @(''\xplainer-probe-root'', ''\xplainer-probe-folder\leaf'')) {',
            '  foreach ($logon in @(''S4U'', ''InteractiveToken'')) {',
            '    $xml = ''<?xml version="1.0" encoding="UTF-16"?>'' +',
            '      ''<Task version="1.4" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">'' +',
            '      ''<Principals><Principal id="Author"><UserId>'' + $me + ''</UserId><LogonType>'' +',
            '      $logon + ''</LogonType><RunLevel>LeastPrivilege</RunLevel></Principal></Principals>'' +',
            '      ''<Settings><Enabled>true</Enabled><AllowStartOnDemand>true</AllowStartOnDemand></Settings>'' +',
            '      ''<Actions Context="Author"><Exec><Command>cmd.exe</Command>'' +',
            '      ''<Arguments>/c exit 0</Arguments></Exec></Actions></Task>''',
            '    try {',
            '      Register-ScheduledTask -Xml $xml -TaskName $name -Force -ErrorAction Stop | Out-Null',
            '      Write-Output "OK       $logon at $name"',
            '      Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue',
            '    } catch {',
            '      Write-Output "REFUSED  $logon at $name -> $($_.Exception.Message)"',
            '    }',
            '  }',
            '}'
          )
          Set-Content -Path $probe -Value $lines -Encoding utf8
          $password = [System.Guid]::NewGuid().ToString() + 'aA1!'
          $secret = ConvertTo-SecureString -String $password -AsPlainText -Force
          Set-LocalUser -Name $env:STANDARD_USER -Password $secret
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:COMPUTERNAME\$env:STANDARD_USER", $secret)
          Start-Process -FilePath 'powershell.exe' -Wait -Credential $credential `
            -WorkingDirectory $root `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                            '-File', $probe) `
            -RedirectStandardOutput $out -RedirectStandardError (Join-Path $root 'register-probe.err.txt')
          Write-Host '--- what the standard user could register ---'
          Get-Content $out -ErrorAction SilentlyContinue | Write-Host
          Get-Content (Join-Path $root 'register-probe.err.txt') -ErrorAction SilentlyContinue | Write-Host
          Write-Host '--- the root task folder DACL, which decides the folder half ---'
          icacls C:\Windows\System32\Tasks | Write-Host
          exit 0

      # The install, as the standard user. `Start-Process -Credential` is what
      # runs a process as another local account from an elevated session; the
      # exit code comes back through `-Wait -PassThru`, and both streams are
      # redirected to files so the transcript survives the step.
      #
      # The account's password is set here rather than carried from the step
      # that created it, because a workflow that put a credential in an output
      # or an environment variable would be writing a secret into the run's own
      # log surface. It is a throwaway local account on a throwaway VM either
      # way, and the shorter its value's life the better.
      #
      # WHOSE ENVIRONMENT THE CHILD GETS, WHICH IS THE HALF THIS STEP GOT WRONG
      # FIRST TIME. `Start-Process -Credential` starts the process as the named
      # account and hands it **this** session's environment block, so the first
      # run of this job installed as `xplainer-t11` while reading runneradmin's
      # `%USERNAME%` and `%LOCALAPPDATA%`: it rendered a task for the wrong
      # principal and tried to mirror the XML into a profile the child has no
      # right to write. Measured on 2026-09-08, run 34177262200:
      #
      #   xplainer daemon install: the task-scheduler artefact could not be
      #   written at C:\Users\runneradmin\AppData\Local\xplainer\service\…:
      #   EPERM: operation not permitted, mkdir '…\xplainer\service'
      #
      # — rolled back cleanly, exit 3. So the standard user's own profile
      # directories go into the environment before the install is started, and
      # a throwaway logon creates that profile first, because a local account
      # that has never logged on has no `C:\Users\<user>` at all.
      - name: Install as the standard user
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:XPLAINER_T11_ROOT
          $log = Join-Path $root 'install.out.txt'
          $err = Join-Path $root 'install.err.txt'
          $password = [System.Guid]::NewGuid().ToString() + 'aA1!'
          $secret = ConvertTo-SecureString -String $password -AsPlainText -Force
          Set-LocalUser -Name $env:STANDARD_USER -Password $secret
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:COMPUTERNAME\$env:STANDARD_USER", $secret)

          # The logon that creates the profile. `Start-Process -Credential` logs
          # on with the profile loaded, so this throwaway process is what makes
          # C:\Users\<user> and the AppData tree under it exist to be read.
          Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'exit', '0' `
            -Credential $credential -WorkingDirectory $PWD -Wait
          $account = New-Object System.Security.Principal.NTAccount(
            $env:COMPUTERNAME, $env:STANDARD_USER)
          $sid = $account.Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profileDir = (Get-ItemProperty $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
          if ([string]::IsNullOrWhiteSpace($profileDir)) {
            throw "no profile directory recorded for $sid after a logon as $env:STANDARD_USER"
          }
          Write-Host "principal: $env:COMPUTERNAME\$env:STANDARD_USER, profile: $profileDir"

          # The environment the child is given, rather than the one it would
          # inherit: `%USERNAME%` and `%USERDOMAIN%` are what the renderer builds
          # `\xplainer\<user>-daemon` and the S4U principal from, `%USERPROFILE%`
          # is what Node's `homedir()` reads, and `%LOCALAPPDATA%` is where the
          # task XML and the daemon's log go. `$env:USER` is set too because the
          # account name is read as USER, then USERNAME, then LOGNAME.
          $env:XPLAINER_STATE_DIR = Join-Path $root 'state'
          $env:USER = $env:STANDARD_USER
          $env:USERNAME = $env:STANDARD_USER
          $env:USERDOMAIN = $env:COMPUTERNAME
          $env:USERPROFILE = $profileDir
          $env:LOCALAPPDATA = Join-Path $profileDir 'AppData\Local'
          $env:APPDATA = Join-Path $profileDir 'AppData\Roaming'
          $process = Start-Process -FilePath 'node' -Wait -PassThru `
            -ArgumentList @(
              'apps\cli\dist\bin.js', 'daemon', 'install',
              '--runtime', (Join-Path $root 'payload'), '--port', '18787') `
            -Credential $credential -WorkingDirectory $PWD `
            -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -ErrorAction SilentlyContinue | Write-Host
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          if ($process.ExitCode -ne 0) { throw "daemon install exited $($process.ExitCode)" }
          Get-ScheduledTask -TaskPath '\xplainer\' | Format-List | Out-String | Write-Host
          Get-ScheduledTaskInfo -TaskName "\xplainer\$env:STANDARD_USER-daemon" |
            Format-List | Out-String | Write-Host
          # The mirrored artefact, under the standard user's own profile and
          # nobody else's — which is the claim the environment above exists to
          # make true, and the one whose failure ended the first run of this job.
          # Its presence is asserted; printing it is best effort, because reading
          # another account's profile file is a permission question of its own.
          $mirror = Join-Path $env:LOCALAPPDATA 'xplainer\service\xplainer-daemon.xml'
          if (-not (Test-Path $mirror)) { throw "the install mirrored no artefact at $mirror" }
          Write-Host "artefact: $mirror"
          Get-Content $mirror -ErrorAction SilentlyContinue | Write-Host

      # Criterion 11: T3's create → put_source → narrate gate against the
      # **installed** daemon. `mcp --attach` reads the socket out of the
      # `daemon.json` the install wrote, so the tools run inside the supervised
      # process — the one whose principal is the standard user's S4U — rather
      # than in a second copy of the server. The client itself runs as the
      # runner's own account, which is the point: what is being established is
      # that the *job* runs under that principal, not who asked for it.
      #
      # bash rather than pwsh, and a heredoc rather than a committed script:
      # this is a JSON-RPC pump and a WAV recorder, and both read as what they
      # are in JavaScript. Git Bash is present on every `windows-latest` runner.
      - name: Drive create → put_source → narrate through the installed daemon
        shell: bash
        run: |
          cat > gate.mjs <<'GATE'
          import { spawn } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import process from "node:process";

          // The speech fixture, recorded on the spot: one sine WAV and its word
          // spans per segment, which is what `XPLAINER_TTS_FIXTURE` names. The
          // gate stops at narration, so nothing here needs a real synthesiser.
          const SEGMENTS = [
            { id: "one", text: "The installed daemon answered.", seconds: 1.5, frequency: 440 },
            { id: "two", text: "And it ran the job.", seconds: 1.2, frequency: 660 },
          ];
          const sineWav = (seconds, frequency) => {
            const rate = 24000;
            const frames = Math.round(rate * seconds);
            const data = Buffer.alloc(frames * 2);
            for (let frame = 0; frame < frames; frame += 1) {
              const value = Math.round(Math.sin((2 * Math.PI * frequency * frame) / rate) * 12000);
              data.writeInt16LE(value, frame * 2);
            }
            const header = Buffer.alloc(44);
            header.write("RIFF", 0);
            header.writeUInt32LE(36 + data.length, 4);
            header.write("WAVEfmt ", 8);
            header.writeUInt32LE(16, 16);
            header.writeUInt16LE(1, 20);
            header.writeUInt16LE(1, 22);
            header.writeUInt32LE(rate, 24);
            header.writeUInt32LE(rate * 2, 28);
            header.writeUInt16LE(2, 32);
            header.writeUInt16LE(16, 34);
            header.write("data", 36);
            header.writeUInt32LE(data.length, 40);
            return Buffer.concat([header, data]);
          };
          const fixtures = join(process.env.XPLAINER_T11_ROOT, "tts-fixtures");
          mkdirSync(fixtures, { recursive: true });
          const manifest = [];
          for (const segment of SEGMENTS) {
            writeFileSync(join(fixtures, `${segment.id}.wav`), sineWav(segment.seconds, segment.frequency));
            const words = segment.text.split(/\s+/);
            const step = segment.seconds / words.length;
            writeFileSync(
              join(fixtures, `${segment.id}-words.json`),
              JSON.stringify(
                words.map((word, index) => ({
                  word,
                  start_time: Number((index * step).toFixed(6)),
                  end_time: Number(((index + 1) * step).toFixed(6)),
                })),
              ),
            );
            manifest.push({ text: segment.text, audio: `${segment.id}.wav`, words: `${segment.id}-words.json` });
          }
          writeFileSync(join(fixtures, "fixtures.json"), JSON.stringify(manifest));

          const child = spawn(process.execPath, ["apps/cli/dist/bin.js", "mcp", "--attach"], {
            stdio: ["pipe", "pipe", "inherit"],
            env: { ...process.env, XPLAINER_TTS_FIXTURE: fixtures },
          });
          const replies = [];
          let buffered = "";
          child.stdout.setEncoding("utf8");
          child.stdout.on("data", (chunk) => {
            buffered += chunk;
            const lines = buffered.split("\n");
            buffered = lines.pop() ?? "";
            for (const line of lines) {
              if (line.trim() !== "") replies.push(JSON.parse(line));
            }
          });
          const send = (message) => child.stdin.write(`${JSON.stringify(message)}\n`);
          const waitFor = async (id, attempts = 600) => {
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              const found = replies.find((reply) => reply.id === id);
              if (found !== undefined) return found;
              await new Promise((done) => setTimeout(done, 200));
            }
            throw new Error(`no reply to ${id}`);
          };
          const call = async (id, name, args) => {
            send({ jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } });
            const reply = await waitFor(id);
            if (reply.result?.isError) throw new Error(`${name}: ${JSON.stringify(reply.result)}`);
            return reply.result?.structuredContent;
          };

          send({ jsonrpc: "2.0", id: 1, method: "initialize", params: {
            protocolVersion: "2025-06-18", capabilities: {},
            clientInfo: { name: "daemon-windows", version: "0" } } });
          await waitFor(1);
          send({ jsonrpc: "2.0", method: "notifications/initialized" });

          console.log(JSON.stringify(await call(2, "explainer_create", { slug: "t11-windows" })));
          await call(3, "explainer_put_source", {
            slug: "t11-windows",
            narration: { voice: "af_heart", speed: 1, fps: 30, segments: SEGMENTS.map(
              (segment) => ({ id: segment.id, text: segment.text })) },
          });
          const enqueued = await call(4, "explainer_narrate", { slug: "t11-windows" });
          console.log(JSON.stringify(enqueued));

          let job = null;
          for (let attempt = 0; attempt < 300; attempt += 1) {
            job = await call(100 + attempt, "explainer_job", { job_id: enqueued.job_id });
            if (job?.state === "done" || job?.state === "error") break;
            await new Promise((done) => setTimeout(done, 1000));
          }
          console.log(JSON.stringify(job));
          child.kill();
          if (job?.state !== "done") {
            console.log(`FAIL: the job ended ${String(job?.state)}`);
            process.exitCode = 1;
          } else {
            console.log("check: the installed daemon, under the S4U principal, reached a terminal done");
          }
          GATE
          XPLAINER_STATE_DIR="$XPLAINER_T11_ROOT/state" node gate.mjs

      - name: Uninstall as the standard user
        if: always()
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          $password = [System.Guid]::NewGuid().ToString() + 'aA1!'
          $secret = ConvertTo-SecureString -String $password -AsPlainText -Force
          Set-LocalUser -Name $env:STANDARD_USER -Password $secret
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:COMPUTERNAME\$env:STANDARD_USER", $secret)
          # The same environment the install was given, for the same reason: an
          # uninstall reading runneradmin's profile would look for a task named
          # after the wrong account and report having removed nothing. The
          # profile exists by now, so this one needs no logon of its own.
          $account = New-Object System.Security.Principal.NTAccount(
            $env:COMPUTERNAME, $env:STANDARD_USER)
          $sid = $account.Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
          $profileDir = (Get-ItemProperty $profileKey -ErrorAction SilentlyContinue).ProfileImagePath
          $env:XPLAINER_STATE_DIR = Join-Path $env:XPLAINER_T11_ROOT 'state'
          if (-not [string]::IsNullOrWhiteSpace($profileDir)) {
            $env:USER = $env:STANDARD_USER
            $env:USERNAME = $env:STANDARD_USER
            $env:USERDOMAIN = $env:COMPUTERNAME
            $env:USERPROFILE = $profileDir
            $env:LOCALAPPDATA = Join-Path $profileDir 'AppData\Local'
            $env:APPDATA = Join-Path $profileDir 'AppData\Roaming'
          }
          $removed = Start-Process -FilePath 'node' -Wait -PassThru `
            -ArgumentList @('apps\cli\dist\bin.js', 'daemon', 'uninstall') `
            -Credential $credential -WorkingDirectory $PWD
          Write-Host "daemon uninstall exited $($removed.ExitCode)"

      - name: Remove the throwaway account and every task it left
        if: always()
        shell: pwsh
        env:
          STANDARD_USER: ${{ inputs.standard_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ScheduledTask -TaskPath '\xplainer\' -ErrorAction SilentlyContinue |
            ForEach-Object { Unregister-ScheduledTask -TaskName $_.TaskName -TaskPath $_.TaskPath -Confirm:$false }
          Remove-LocalUser -Name $env:STANDARD_USER -ErrorAction SilentlyContinue
          Write-Host 'tasks and account removed'

  # ── T26 ────────────────────────────────────────────────────────────────────
  #
  # R-SEC-5's Windows half, both ends of it, and R-SEC-8's rotation against a
  # daemon that stays installed. Everything below is only answerable here: a
  # mode is not protection on this platform, so the entry `icacls` writes and
  # the entry `daemon status` reads back are the protection, and neither can be
  # observed from a machine that has no `icacls`.
  token-acl:
    name: the token's ACL, its re-verification, and a rotation (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      # The unit halves first, so a failure here is read as "the command line or
      # the parse is wrong" rather than as "Windows disagrees". Everything after
      # this step is about the filesystem and the pipe.
      - name: The ACL and pipe-descriptor units
        run: >
          pnpm --filter @xplainer/cli exec vitest run
          src/daemon/windows-acl.test.ts src/daemon/pipe-acl.test.ts
          src/daemon/token.test.ts src/commands/token.test.ts

      # A real daemon mints a real token, and `icacls` is asked what is on it.
      # `/inheritance:r /grant:r` leaves exactly one entry, so the assertion is
      # an exact one: this account, and nothing else, and no `(I)`.
      - name: A minted token carries one entry, for this account, not inherited
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'xplainer-t26'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:XPLAINER_STATE_DIR = Join-Path $root 'state'
          $daemon = Start-Process -FilePath 'node' -PassThru `
            -ArgumentList @('apps\cli\dist\bin.js', 'serve', '--port', '0') `
            -RedirectStandardOutput (Join-Path $root 'ready.json') `
            -RedirectStandardError (Join-Path $root 'serve.log')
          "XPLAINER_T26_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XPLAINER_T26_PID=$($daemon.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $token = Join-Path $env:XPLAINER_STATE_DIR 'token'
          foreach ($attempt in 1..60) {
            if (Test-Path $token) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $token)) {
            Get-Content (Join-Path $root 'serve.log') | Write-Host
            throw "the daemon never minted a token"
          }

          $acl = Get-Acl -Path $token
          $acl.AccessToString | Write-Host
          if ($acl.AreAccessRulesProtected -ne $true) {
            throw "inheritance was not removed from $token"
          }
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $rules = @($acl.Access)
          if ($rules.Count -ne 1) {
            throw "expected exactly one entry on $token, found $($rules.Count)"
          }
          $granted = $rules[0].IdentityReference.Translate([System.Security.Principal.SecurityIdentifier])
          if ($granted -ne $me) {
            throw "the entry on $token names $granted and not $me"
          }
          Write-Host "token ACL: one entry, $granted, not inherited"

      # The second half of R-SEC-5, and the only place it can fire: inheritance
      # is switched back on underneath a running daemon, and `daemon status` has
      # to say so. Nothing else about the file changes — the mode is identical
      # before and after — which is exactly why the re-verification exists.
      - name: daemon status warns once inheritance is restored
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:XPLAINER_STATE_DIR = Join-Path $env:XPLAINER_T26_ROOT 'state'
          $token = Join-Path $env:XPLAINER_STATE_DIR 'token'

          $clean = & node apps\cli\dist\bin.js daemon status 2>&1 | Out-String
          $clean | Write-Host
          if ($clean -notmatch 'token file:\s+.*one access-control entry') {
            throw "daemon status did not report the token file as owner-only"
          }

          icacls $token /inheritance:e | Out-Null
          icacls $token | Write-Host
          $widened = & node apps\cli\dist\bin.js daemon status 2>&1 | Out-String
          $widened | Write-Host
          if ($widened -notmatch 'token file:\s+WARNING') {
            throw "daemon status did not warn after inheritance was restored"
          }
          if ($widened -notmatch 'Inheritance has been restored') {
            throw "the warning did not name inheritance as the reason"
          }
          Write-Host 're-verification warned, and named the remedy'

      # R-SEC-8 end to end, against the daemon started two steps above: it is
      # still running, it was never restarted, and after the rotation both the
      # new value and the retired one open it. The new files carry the same
      # single entry the mint's did, because a grace file holds a live
      # credential.
      - name: token rotate, with the daemon still up, and both values accepted
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:XPLAINER_STATE_DIR = Join-Path $env:XPLAINER_T26_ROOT 'state'
          $token = Join-Path $env:XPLAINER_STATE_DIR 'token'
          $previous = "$token.previous"
          # Undo the widening of the step above, so what is asserted below is
          # the rotation's own doing.
          icacls $token /inheritance:r /grant:r "$($env:USERNAME):(R,W)" | Out-Null

          $ready = Get-Content (Join-Path $env:XPLAINER_T26_ROOT 'ready.json') -Raw | ConvertFrom-Json
          $port = $ready.port
          $before = (Get-Content $token -Raw).Trim()
          $healthz = "http://127.0.0.1:$port/healthz"
          $answer = Invoke-WebRequest -Uri $healthz -Headers @{ Authorization = "Bearer $before" } -UseBasicParsing
          if ($answer.StatusCode -ne 200) { throw "the daemon did not answer its own token" }

          & node apps\cli\dist\bin.js token rotate --grace 600 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "token rotate exited $LASTEXITCODE" }
          $after = (Get-Content $token -Raw).Trim()
          if ($after -eq $before) { throw "the token file was not rewritten" }

          foreach ($path in @($token, $previous)) {
            $acl = Get-Acl -Path $path
            if ($acl.AreAccessRulesProtected -ne $true -or @($acl.Access).Count -ne 1) {
              $acl.AccessToString | Write-Host
              throw "$path is not owner-only after the rotation"
            }
          }

          foreach ($value in @($after, $before)) {
            $reply = Invoke-WebRequest -Uri $healthz -Headers @{ Authorization = "Bearer $value" } -UseBasicParsing
            if ($reply.StatusCode -ne 200) { throw "a value inside the window was refused" }
          }
          Write-Host 'rotated: both values accepted by a daemon that was never restarted'

          & node apps\cli\dist\bin.js token rotate --grace 0 | Write-Host
          $third = (Get-Content $token -Raw).Trim()
          if (Test-Path $previous) { throw "--grace 0 left a grace file behind" }
          foreach ($value in @($before, $after)) {
            try {
              Invoke-WebRequest -Uri $healthz -Headers @{ Authorization = "Bearer $value" } -UseBasicParsing | Out-Null
              throw "a retired value still opened the daemon after --grace 0"
            } catch [System.Net.WebException] {
              if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw }
            }
          }
          $last = Invoke-WebRequest -Uri $healthz -Headers @{ Authorization = "Bearer $third" } -UseBasicParsing
          if ($last.StatusCode -ne 200) { throw "the newest token was refused" }
          Write-Host 'closed: only the newest value is accepted'

      - name: Stop the daemon
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:XPLAINER_T26_PID) {
            taskkill /PID $env:XPLAINER_T26_PID /T /F | Out-Host
          }
          if ($env:XPLAINER_T26_ROOT) {
            Get-Content (Join-Path $env:XPLAINER_T26_ROOT 'serve.log') -ErrorAction SilentlyContinue |
              Write-Host
          }

  # The gap neither ADR 0020 nor round 1 closed: `icacls` on the token says
  # nothing about the **named pipe**, which on Windows replaces the `0700`
  # directory that authenticates the unix socket. Microsoft documents the
  # default descriptor libuv's pipe is born with as granting "read access to
  # members of the Everyone group and the anonymous account", so this is the one
  # job that can say whether a second account is actually kept out.
  pipe-acl:
    name: a second local account cannot open the pipe (windows-latest)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable corepack
        run: corepack enable

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

      - name: Build every member
        run: pnpm turbo build

      - name: Create the second local account
        shell: pwsh
        env:
          SECOND_USER: ${{ inputs.second_user }}
        run: |
          $ErrorActionPreference = 'Stop'
          $password = [System.Guid]::NewGuid().ToString() + 'aA1!'
          $secret = ConvertTo-SecureString -String $password -AsPlainText -Force
          New-LocalUser -Name $env:SECOND_USER -Password $secret -AccountNeverExpires `
            -PasswordNeverExpires | Out-Null
          "XPLAINER_T26_SECOND_PASSWORD=$password" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "created $env:COMPUTERNAME\$env:SECOND_USER (Users only)"

      # The daemon binds its pipe and narrows it. The descriptor is read back in
      # the step after this one, because "Everyone is gone" is the fact the
      # two-account probe below is a consequence of.
      - name: Start a daemon and note the pipe it bound
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'xplainer-t26-pipe'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:XPLAINER_STATE_DIR = Join-Path $root 'state'
          $daemon = Start-Process -FilePath 'node' -PassThru `
            -ArgumentList @('apps\cli\dist\bin.js', 'serve', '--port', '0') `
            -RedirectStandardOutput (Join-Path $root 'ready.json') `
            -RedirectStandardError (Join-Path $root 'serve.log')
          "XPLAINER_T26_PIPE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XPLAINER_T26_PIPE_PID=$($daemon.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $readyFile = Join-Path $root 'ready.json'
          $ready = $null
          foreach ($attempt in 1..60) {
            # `Get-Content -Raw` on a zero-byte file answers `$null`, and `Start-Process
            # -RedirectStandardOutput` creates that file the instant the child starts — so
            # `.Trim()` on the first pass is a method call on `$null`, which under
            # `$ErrorActionPreference = 'Stop'` ends the step before the daemon has had a
            # millisecond. `IsNullOrWhiteSpace` takes a null and answers `$true`.
            $line = if (Test-Path $readyFile) { Get-Content $readyFile -Raw } else { $null }
            if (-not [string]::IsNullOrWhiteSpace($line)) {
              $ready = $line | ConvertFrom-Json
              break
            }
            # A daemon that exited says so faster than the loop can time out, and its reason is in
            # `serve.log` rather than in anything this step can see.
            if ($daemon.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          # Whatever happened, print what the daemon said: the step that redirected stderr to a file
          # and showed none of it is why the first failure here reported nothing at all.
          Write-Host '--- serve.log ---'
          Get-Content (Join-Path $root 'serve.log') -ErrorAction SilentlyContinue | Write-Host
          Write-Host '--- end serve.log ---'
          if ($null -eq $ready) {
            $why = if ($daemon.HasExited) { "it exited $($daemon.ExitCode)" } else { 'it is still running' }
            throw "the daemon never announced a ready line ($why)"
          }
          $name = $ready.socket -replace '^\\\\[.?]\\pipe\\', ''
          "XPLAINER_T26_PIPE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pipe: $($ready.socket)"

      # `shell: powershell` — Windows PowerShell, deliberately, and the same host
      # `daemon/pipe-acl.ts` shells out to. `PipeSecurity`, `PipeAccessRule` and
      # `PipeStream.GetAccessControl()` are instance members of the .NET Framework
      # types; in PowerShell 7 the same three live behind
      # `System.IO.Pipes.AccessControl`'s extension methods and a static factory,
      # so a step written for one host does not run on the other. One host, one
      # spelling, on both sides of this proof.
      - name: The pipe's descriptor names this account and not Everyone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = $env:XPLAINER_T26_PIPE_NAME
          # `ReadData` and not only `ReadPermissions`: this constructor derives the
          # pipe's direction from the rights and throws ArgumentOutOfRangeException
          # for a value carrying neither `ReadData` nor `WriteData`, so a
          # permissions-only probe never opens the pipe it is asking about. The
          # same rule is why `daemon/pipe-acl.ts`'s own opener asks for it.
          $rights = [System.IO.Pipes.PipeAccessRights]'ReadData,ReadPermissions'
          $client = New-Object System.IO.Pipes.NamedPipeClientStream('.', $name, $rights,
            [System.IO.Pipes.PipeOptions]::None,
            [System.Security.Principal.TokenImpersonationLevel]::None,
            [System.IO.HandleInheritability]::None)
          try {
            $client.Connect(5000)
            $security = $client.GetAccessControl()
            $sddl = $security.GetSecurityDescriptorSddlForm('Access')
            Write-Host "pipe DACL: $sddl"
            $everyone = New-Object System.Security.Principal.SecurityIdentifier 'S-1-1-0'
            if ($sddl -match [regex]::Escape($everyone.Value)) {
              throw "the pipe still grants Everyone: $sddl"
            }
            $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            if ($sddl -notmatch [regex]::Escape($me.Value)) {
              throw "the pipe does not grant this account: $sddl"
            }
          } finally {
            $client.Dispose()
          }
          Write-Host 'pipe descriptor: this account, and not Everyone'

      # The assertion the whole story is for. A second local account opens the
      # pipe the way any client would — `PipeDirection.In`, which the **default**
      # descriptor grants to Everyone — and has to be refused.
      - name: A second local account is refused the pipe
        shell: pwsh
        env:
          SECOND_USER: ${{ inputs.second_user }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:XPLAINER_T26_PIPE_ROOT
          $probeDir = Join-Path $root 'probe'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          $probe = Join-Path $probeDir 'open-pipe.ps1'
          # Written a line at a time rather than as a here-string: a here-string's
          # terminator has to start its own line, and a line at column 0 inside a
          # YAML block scalar ends the block. Every line below is single-quoted
          # PowerShell, so nothing here is expanded until the second account runs
          # it — which is why the server name arrives as a parameter and the two
          # answers are barewords.
          $lines = @(
            'param([string]$Server, [string]$Name, [string]$Answer)',
            '$direction = [System.IO.Pipes.PipeDirection]::In',
            '$client = New-Object System.IO.Pipes.NamedPipeClientStream($Server, $Name, $direction)',
            'try {',
            '  $client.Connect(3000)',
            '  Set-Content -Path $Answer -Value opened -Encoding ascii',
            '} catch {',
            '  $failure = $_.Exception',
            '  $denied = ($failure -is [System.UnauthorizedAccessException]) -or',
            '    ($failure.InnerException -is [System.UnauthorizedAccessException])',
            '  if ($denied) {',
            '    Set-Content -Path $Answer -Value denied -Encoding ascii',
            '  } else {',
            '    $said = "other: " + $failure.GetType().FullName + ": " + $failure.Message',
            '    Set-Content -Path $Answer -Value $said -Encoding ascii',
            '  }',
            '} finally {',
            '  $client.Dispose()',
            '}'
          )
          $lines | Set-Content -Path $probe -Encoding ascii
          $answer = Join-Path $probeDir 'answer.txt'
          icacls $probeDir /grant "$($env:SECOND_USER):(OI)(CI)M" | Out-Null

          $secret = ConvertTo-SecureString -String $env:XPLAINER_T26_SECOND_PASSWORD `
            -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential(
            "$env:COMPUTERNAME\$env:SECOND_USER", $secret)
          $run = Start-Process -FilePath 'powershell.exe' -Wait -PassThru -Credential $credential `
            -WorkingDirectory $probeDir `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
              '-File', $probe, '-Server', '.', '-Name', $env:XPLAINER_T26_PIPE_NAME,
              '-Answer', $answer)
          Write-Host "the second account's probe exited $($run.ExitCode)"
          if (-not (Test-Path $answer)) { throw 'the second account wrote no answer at all' }
          $said = (Get-Content $answer -Raw).Trim()
          Write-Host "the second account got: $said"
          if ($said -ne 'denied') {
            throw "a second local account was not refused the pipe: $said"
          }
          Write-Host 'two accounts, one pipe, and only the creating account can open it'

      - name: Stop the daemon and remove the second account
        if: always()
        shell: pwsh
        env:
          SECOND_USER: ${{ inputs.second_user }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:XPLAINER_T26_PIPE_PID) {
            taskkill /PID $env:XPLAINER_T26_PIPE_PID /T /F | Out-Host
          }
          Remove-LocalUser -Name $env:SECOND_USER -ErrorAction SilentlyContinue
          Write-Host 'daemon stopped and account removed'
